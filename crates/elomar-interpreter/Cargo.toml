[package]
name = "elomar-interpreter"
description = "Bytecode engine and tree-walking interpreter for Elomar-Lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# SQLite (`std.db`), HTTP requests (`std.http`) and secure random numbers.
# Turn off for targets without them, such as the browser playground.
default = ["native"]
native = ["dep:rusqlite", "dep:ureq", "dep:elomar-tls", "dep:getrandom"]

[dependencies]
elomar-diagnostics.workspace = true
elomar-ast.workspace = true
elomar-ai-core.workspace = true
elomar-mcp.workspace = true
elomar-policy.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
rusqlite = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
elomar-tls = { workspace = true, optional = true }
url.workspace = true
regex.workspace = true
sha2.workspace = true
hmac.workspace = true
argon2.workspace = true
base64.workspace = true
getrandom = { workspace = true, optional = true }
percent-encoding.workspace = true

[dev-dependencies]
elomar-ai-provider-mock.workspace = true
elomar-parser.workspace = true
elomar-types.workspace = true
