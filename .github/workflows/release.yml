# Builds `elomar` for Windows, Linux and macOS (x64 and ARM) and the VS Code
# extension.
#
# - Pushing a tag `vX.Y.Z` (matching `version` in Cargo.toml) builds
#   everything and creates the GitHub release, with the notes of that
#   version from CHANGELOG.md.
# - Running it by hand (workflow_dispatch) only builds the files, to try
#   the workflow; they are kept as artifacts of the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
          # An older Ubuntu, so the binary also runs on older glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            native: true
          # ARM: Raspberry Pi and ARM servers; Windows on ARM laptops.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
            native: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p elomar-cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.native
        run: |
          bin=target/${{ matrix.target }}/release/elomar
          "$bin" --version
          "$bin" run examples/hello/main.elo
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="elomar-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then exe=elomar.exe; else exe=elomar; fi
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: elomar-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  vsix:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python -I editor/vscode/build_vsix.py "dist/elomar-lang-$version.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: elomar-vscode
          path: dist/*
          if-no-files-found: error

  release:
    name: Create the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Elomar-Lang ${GITHUB_REF_NAME}" \
            --notes-file notes.md
