# The VS Code extension.
#
# - On every change under editor/vscode, packages it with the official
#   `vsce` tool, so problems show up before a release.
# - On a version tag (vX.Y.Z), also publishes it to the VS Code Marketplace
#   and to Open VSX (used by VSCodium, Cursor and others), when the
#   repository has the secrets VSCE_PAT and OVSX_PAT. Without a secret, that
#   store is skipped. See docs/releasing.md.
name: VS Code extension

on:
  push:
    branches: [main]
    paths: ["editor/vscode/**", ".github/workflows/vscode.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["editor/vscode/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version in package.json"
            exit 1
          fi
      - name: Package with vsce
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out elomar-lang.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsce-package
          path: editor/vscode/elomar-lang.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: vsce-package
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set; skipping the VS Code Marketplace."
            exit 0
          fi
          npx --yes @vscode/vsce@3 publish --packagePath elomar-lang.vsix -p "$VSCE_PAT"
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@0 publish elomar-lang.vsix -p "$OVSX_PAT"
