# The VS Code extension.
#
# - On every change under editor/vscode, packages it with the official
#   `vsce` tool, so problems show up before a release.
# - On a version tag (vX.Y.Z), also publishes it to Open VSX (used by
#   VSCodium, Cursor and others) when the repository has the secret
#   OVSX_PAT, and to the VS Code Marketplace through the Marketplace's
#   Trusted Publishing (no secret: GitHub proves which workflow is asking).
#   A version already in a store is skipped. See docs/releasing.md.
# - Run by hand (workflow_dispatch) to publish the current version again,
#   for example after adding a secret.
name: VS Code extension

on:
  push:
    branches: [main]
    paths: ["editor/vscode/**", ".github/workflows/vscode.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["editor/vscode/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version in package.json"
            exit 1
          fi
      - name: Package with vsce
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out elomar-lang.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsce-package
          path: editor/vscode/elomar-lang.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the Marketplace check that this workflow is the one allowed to
      # publish (Trusted Publishing).
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: vsce-package
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set; skipping Open VSX."
            exit 0
          fi
          # The namespace must exist before the first publish; creating it
          # again fails harmlessly.
          npx --yes ovsx@0 create-namespace abobasel86 -p "$OVSX_PAT" || true
          npx --yes ovsx@0 publish elomar-lang.vsix -p "$OVSX_PAT" --skip-duplicate
      - name: VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --packagePath elomar-lang.vsix --oidc --skip-duplicate
