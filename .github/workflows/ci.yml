# Format, lint and test on every push and pull request (spec §24.4).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Elomar files are formatted
        run: cargo run --quiet -p elomar-cli -- fmt --check examples tests

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `python` for the std.py and MCP tests (a fixture server is in Python).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The tests need no network and no API keys: AI calls go to the mock
      # provider or to a fake OpenAI server on 127.0.0.1.
      - name: Tests
        run: cargo test --workspace --locked

  playground:
    name: Playground (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Builds the interpreter without SQLite and HTTP, as the website does.
      - name: Clippy
        run: cargo clippy --locked -p elomar-playground --target wasm32-unknown-unknown -- -D warnings
      - name: Tests (native, same code paths)
        run: cargo test --locked -p elomar-playground

  fuzz:
    name: Fuzz testing (1 minute)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Mutated programs through the parser, checker, formatter and
      # interpreter. A different seed each run widens what is tried; a
      # crash is saved, with its seed, as an artifact to reproduce.
      - name: Fuzz
        run: cargo run --locked --profile fuzzing -p elomar-fuzz -- --seconds 60 --seed ${{ github.run_id }}
      - name: Keep the programs that crashed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: target/fuzz-results/

  installers:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The scripts in this commit install the latest release, then run it.
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.elomar/bin/elomar" --version
          "$HOME/.elomar/bin/elomar" new hello --ai mock
          cd hello && "$HOME/.elomar/bin/elomar" run src/main.elo
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression
          elomar --version
          elomar new hello --ai mock
          Set-Location hello
          elomar run src/main.elo
      # The package-manager files in this commit (packaging/update.py writes
      # them for each release) install the latest release.
      - name: Homebrew
        if: runner.os != 'Windows'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          tap="$(brew --repository)/Library/Taps/abobasel86/homebrew-elomar"
          mkdir -p "$tap/Formula"
          cp Formula/elomar.rb "$tap/Formula/"
          brew install abobasel86/elomar/elomar
          brew test abobasel86/elomar/elomar
          "$(brew --prefix)/bin/elomar" --version
      - name: Scoop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          # A full path: Scoop reads "bucket/elomar.json" as bucket "bucket", app "elomar.json".
          scoop install "$PWD\bucket\elomar.json"
          if (-not (Test-Path "$env:USERPROFILE\scoop\shims\elomar.exe")) { exit 1 }
          & "$env:USERPROFILE\scoop\shims\elomar.exe" --version
          & "$env:USERPROFILE\scoop\shims\elomar.exe" run examples/hello/main.elo
