[workspace]
resolver = "3"
members = [
    "crates/elomar-diagnostics",
    "crates/elomar-lexer",
    "crates/elomar-ast",
    "crates/elomar-parser",
    "crates/elomar-loader",
    "crates/elomar-pkg",
    "crates/elomar-mcp",
    "crates/elomar-fmt",
    "crates/elomar-types",
    "crates/elomar-policy",
    "crates/elomar-ai-core",
    "crates/elomar-ai-provider-mock",
    "crates/elomar-ai-provider-openai",
    "crates/elomar-ai-provider-anthropic",
    "crates/elomar-interpreter",
    "crates/elomar-cli",
    "crates/elomar-playground",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/abobasel86/elomar-lang"

[workspace.dependencies]
elomar-diagnostics = { path = "crates/elomar-diagnostics" }
elomar-lexer = { path = "crates/elomar-lexer" }
elomar-ast = { path = "crates/elomar-ast" }
elomar-parser = { path = "crates/elomar-parser" }
elomar-loader = { path = "crates/elomar-loader" }
elomar-pkg = { path = "crates/elomar-pkg" }
elomar-mcp = { path = "crates/elomar-mcp" }
elomar-fmt = { path = "crates/elomar-fmt" }
elomar-types = { path = "crates/elomar-types" }
elomar-policy = { path = "crates/elomar-policy" }
# Without its default `native` feature; crates that need SQLite and HTTP turn it on.
elomar-interpreter = { path = "crates/elomar-interpreter", default-features = false }
elomar-ai-core = { path = "crates/elomar-ai-core" }
elomar-ai-provider-mock = { path = "crates/elomar-ai-provider-mock" }
elomar-ai-provider-openai = { path = "crates/elomar-ai-provider-openai" }
elomar-ai-provider-anthropic = { path = "crates/elomar-ai-provider-anthropic" }
elomar-playground = { path = "crates/elomar-playground" }

unicode-ident = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
semver = "1"
regex = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
percent-encoding = "2"
