# A real OpenAI model. This example is not part of the automated tests:
# it needs an API key and each run costs money.
[package]
name = "ai-openai"
version = "0.1.0"
entry = "main.elo"

[ai.models."support.classifier"]
provider = "openai"
model = "REPLACE_WITH_SUPPORTED_MODEL_ID"   # an OpenAI model that supports structured outputs
api_key_env = "OPENAI_API_KEY"               # the key itself never goes in this file

[ai.policy]
max_calls_per_run = 5

# Default deny: without this line every request is refused with PolicyDenied.
[permissions]
network_hosts = ["api.openai.com"]
